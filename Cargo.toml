[package]
name = "clip-md-html"
version = "0.1.0"
edition = "2021"
description = "Convertit le Markdown du presse-papiers en HTML riche et le colle (Win+Alt+V)"
license = "MIT"

[dependencies]
pulldown-cmark = { version = "=0.13.5", default-features = false, features = ["html"] }
arboard = { version = "=3.7.0", default-features = false }
global-hotkey = "=0.9.0"
tray-icon = { version = "=0.26.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"


[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.61.2"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
