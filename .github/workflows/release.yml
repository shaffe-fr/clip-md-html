name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: clip-md-html.exe
            asset: clip-md-html-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            file: clip-md-html
            asset: clip-md-html-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            file: clip-md-html
            asset: clip-md-html-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Renommer le binaire
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.file }}" "${{ matrix.asset }}"
      # SignPath exige l'exécutable non signé comme artefact du workflow.
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
      # Signature Windows via SignPath Foundation. Activer en définissant la variable
      # de dépôt SIGNPATH_ENABLED=true, le secret SIGNPATH_API_TOKEN et les variables
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG.
      - name: Signer avec SignPath
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Remplacer par le binaire signé
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: cp "signed/${{ matrix.asset }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error


  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: clip-md-html-*
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
